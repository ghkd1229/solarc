<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SOLARC — 태닝 성향 테스트</title>
    <meta
      name="description"
      content="네 번의 선택으로 발견하는 나만의 햇빛 취향. SOLARC 태닝 성향 테스트."
    />
    <link rel="stylesheet" href="/style.css?v=four-questions-1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fustat:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="sun-wire" data-page="1">
      <nav aria-label="화면 선택"></nav>
      <section class="screen">
        <img
          class="hero-background"
          src="/assets/hero-sunset.png?v=hero-3"
          alt=""
          width="1947"
          height="1096"
          fetchpriority="high"
        />
        <header>
          <span>SOLARC / FIND YOUR SUN</span><span id="count">INTRO</span>
        </header>
        <div class="copy">
          <small id="eyebrow">TANNING PERSONALITY TEST</small>
          <h2 id="title">당신의 햇빛에는<br />어떤 취향이 있나요?</h2>
          <p id="subtitle">네 번의 선택으로 발견하는 나만의 선 라이프.</p>
        </div>
        <div id="stage"></div>
        <footer>
          <button id="back">이전</button
          ><span id="selection" aria-live="polite"></span
          ><button id="next">나의 햇빛 찾기 →</button>
        </footer>
      </section>
    </div>
    <section id="ritual" aria-label="Sun care rituals">
      <div class="ritual-canvas">
        <div class="ritual-cards">
          <button
            class="ritual-card before"
            aria-label="Before — Scrub 제품 보기"
            aria-expanded="false"
          >
            <span class="ritual-gradient"></span>
            <span class="ritual-sun"
              ><img
                class="glow"
                src="/assets/ritual-before-glow.svg"
                alt="" /><img
                class="halo"
                src="/assets/ritual-before-halo.svg"
                alt="" /><img
                class="core"
                src="/assets/ritual-before-sun.svg"
                alt=""
            /></span>
            <span class="ritual-label">[ Before ]</span>
          </button>
          <div
            class="ritual-card during"
            tabindex="0"
            aria-label="During — 해의 이동"
          >
            <span class="ritual-gradient"></span
            ><span class="ritual-sun"
              ><img src="/assets/ritual-during.svg" alt="" /></span
            ><span class="ritual-label">[ During ]</span>
          </div>
          <div
            class="ritual-card after"
            tabindex="0"
            aria-label="After — 해의 이동"
          >
            <span class="ritual-gradient"></span
            ><span class="ritual-sun"
              ><img src="/assets/ritual-after.svg" alt="" /></span
            ><span class="ritual-label">[ After ]</span>
          </div>
        </div>
        <section class="ritual-product" aria-label="Before — Scrub" hidden>
          <div class="product-background"></div>
          <img
            class="product-horizon"
            src="/assets/ritual-horizon.svg"
            alt=""
          />
          <button class="product-back" aria-label="Before 카드로 돌아가기">
            [ Before ]</button
          ><span class="product-category">Product</span>
          <img
            class="scrub-jar"
            src="/assets/ritual-scrub.png"
            alt="Solarc Scrub"
            width="263"
            height="257"
          />
          <h2>Scrub</h2>
          <p class="product-description">설명 설명</p>
          <button class="product-cart">+ Add To Cart</button>
          <p class="cart-feedback" role="status"></p>
        </section>
      </div>
    </section>
    <script src="/app.js?v=ritual-1"></script>
  </body>
</html>
